services:
  db:
    image: mysql:8.0
    container_name: primal-fitness-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: primal_fitness
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: primal_user
      MYSQL_PASSWORD: primal_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/create_tables.sql:/docker-entrypoint-initdb.d/01-create_tables.sql:ro
      - ./Database/populate_tables.sql:/docker-entrypoint-initdb.d/02-populate_tables.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: primal-fitness-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: primal_user
      DB_PASSWORD: primal_password
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: primal_fitness
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ../Frontend
    container_name: primal-fitness-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
      VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
      VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
    ports:
      - "5173:5173"

volumes:
  mysql_data:
